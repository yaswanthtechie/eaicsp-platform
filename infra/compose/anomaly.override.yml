# Anomaly services for the shared environment (#232).
# Overlay file: infra/docker-compose.yml does not exist yet (owned by Ajith).
# Service names `kafka` and `influxdb` and the internal listener kafka:29092
# are those of ml-services/anomaly-detection/docker-compose.stream.yml.
# When the shared file lands, move these two blocks in and adjust the names.
services:
  anomaly-detector:
    build:
      context: .
      dockerfile: ml-services/anomaly-detection/Dockerfile
    command: ["python", "-m", "src.stream_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-eaicsp}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-iot_sensors}
    volumes:
      - ./ml-services/anomaly-detection/models:/app/ml-services/anomaly-detection/models:ro
    depends_on:
      - kafka
      - influxdb
    restart: on-failure

  anomaly-simulator:
    build:
      context: .
      dockerfile: ml-services/anomaly-detection/Dockerfile
    command:
      - python
      - -m
      - src.stream_simulator
      - --publish
      - --sensors-config
      - config/sensors.json
      - --n-per-sensor
      - "1500"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    restart: on-failure