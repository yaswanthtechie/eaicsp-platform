x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:${AIRFLOW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow_user:${AIRFLOW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

x-airflow-common: &airflow-common
  image: eaicsp-airflow:2.10.5
  build:
    context: ../data-platform/etl
  environment:
    <<: *airflow-env
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${POSTGRES_DB}
    DB_USER: etl_user
    DB_PASSWORD: ${ETL_DB_PASSWORD}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PYTHONPATH: /opt/airflow:/opt/airflow/etl/src
  volumes:
    - ../data-platform/etl/dags:/opt/airflow/dags
    - ../data-platform/etl/logs:/opt/airflow/logs
    - ../data-platform/etl/etl:/opt/airflow/etl
    - ../data-platform/etl/data:/opt/airflow/data
    - ../data-platform/etl/pipeline_config.yaml:/opt/airflow/pipeline_config.yaml
    - ../data-platform/etl/scripts:/opt/airflow/scripts
    - ../data-platform/etl/spark:/opt/airflow/spark
    - ../data-platform/etl/dbt:/opt/airflow/dbt
    - ../data-platform/etl/client_ingest:/opt/airflow/client_ingest
    - ../data-platform/seed:/opt/seed
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - shared
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      SUPPLIER_PORTAL_DB_PASSWORD: ${SUPPLIER_PORTAL_DB_PASSWORD}
      COMPLIANCE_DB_PASSWORD: ${COMPLIANCE_DB_PASSWORD}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      LOGISTICS_DB_PASSWORD: ${LOGISTICS_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shared

  airflow-db-bootstrap:
    image: postgres:16-alpine
    command: ["bash", "/scripts/bootstrap-airflow-client.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      CLIENT_INGEST_DB_PASSWORD: ${CLIENT_INGEST_DB_PASSWORD}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
    volumes:
      - ./postgres/bootstrap-airflow-client.sh:/scripts/bootstrap-airflow-client.sh:ro
      - ../data-platform/etl/sql/client_ingest_schema.sql:/sql/client_ingest_schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - shared
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    command: version
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - CMD-SHELL
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  client-data-loader:
    image: eaicsp-airflow:2.10.5
    build:
      context: ../data-platform/etl
    profiles:
      - client-ingest
    command:
      - python
      - -m
      - client_ingest.load_client_data
      - --dir
      - /opt/airflow/client_ingest/samples/client_format
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: client_ingest_user
      DB_PASSWORD: ${CLIENT_INGEST_DB_PASSWORD}
      PYTHONPATH: /opt/airflow:/opt/airflow/etl/src
    volumes:
      - ../data-platform/etl/client_ingest:/opt/airflow/client_ingest
      - ../data-platform/etl/etl:/opt/airflow/etl
      - ../data-platform/seed:/opt/seed
    depends_on:
      postgres:
        condition: service_healthy
      airflow-db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - shared
  kafka:
    image: apache/kafka:4.0.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    networks:
      - shared

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      shared:
        aliases:
          - infra-redis

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      shared:
        aliases:
          - infra-clickhouse

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - shared

  minio:
    image: eaicsp/minio-with-client:local
    build:
      context: ./minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      shared:
        aliases:
          - infra-minio

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - shared

  mlflow:
    image: python:3.12-slim
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir "SQLAlchemy>=2.0.0,<2.1.0" mlflow==3.4.0 psycopg2-binary boto3 &&
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "postgresql://mlflow_user:$${MLFLOW_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?options=-csearch_path%3Dmlflow" \
          --default-artifact-root s3://ml-models
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks:
      shared:
        aliases:
          - infra-mlflow

  minio-init:
    image: chainguard/minio-client:latest
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000"
    command: ["mb", "--ignore-existing", "local/supplier-docs"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - shared

  minio-init-models:
    image: chainguard/minio-client:latest
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000"
    command: ["mb", "--ignore-existing", "local/ml-models"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - shared

  minio-init-reports:
    image: chainguard/minio-client:latest
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000"
    command: ["mb", "--ignore-existing", "local/generated-reports"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - shared

  platform:
    build:
      context: ../services/platform
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in .env}
      DATABASE_URL: postgresql+psycopg2://platform_user:${PLATFORM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BASE_URL: http://platform:8005
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shared

  compliance:
    build:
      context: ../services/compliance
    environment:
      DATABASE_URL: postgresql+psycopg://compliance_user:${COMPLIANCE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PLATFORM_AUTH_URL: http://platform:8005
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USE_FIXTURES: ${COMPLIANCE_USE_FIXTURES:-false}
      ENVIRONMENT: development
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - shared

  inventory:
    build:
      context: ../services/inventory
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://inventory_user:${INVENTORY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PLATFORM_AUTH_URL: http://platform:8005
      COMPLIANCE_SERVICE_URL: http://compliance:8003
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENABLE_OUTBOX_RELAY: "true"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      platform:
        condition: service_healthy
      compliance:
        condition: service_healthy
    networks:
      - shared

  logistics:
    build:
      context: ../services/logistics
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - shared

  supplier-portal:
    build:
      context: ../services/supplier-portal
    environment:
      DATABASE_URL: postgresql+psycopg://supplier_portal_user:${SUPPLIER_PORTAL_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SUPPLIER_DB_SCHEMA: supplier_portal
      PLATFORM_AUTH_URL: http://platform:8005
      COMPLIANCE_SERVICE_URL: http://compliance:8003
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: supplier-docs
      MINIO_SECURE: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      COMPLIANCE_DB_PATH: /app/data/compliance_state.db
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      platform:
        condition: service_healthy
      compliance:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shared

  api-gateway:
    build:
      context: ../services/api-gateway
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in .env}
      PLATFORM_SERVICE_URL: http://platform:8005
      INVENTORY_SERVICE_URL: http://inventory:8001
      SHIPMENTS_SERVICE_URL: http://logistics:8002
      COMPLIANCE_SERVICE_URL: http://compliance:8003
      PURCHASE_ORDERS_SERVICE_URL: http://supplier-portal:8004
    ports:
      - "8000:8000"
    depends_on:
      platform:
        condition: service_healthy
      inventory:
        condition: service_healthy
      logistics:
        condition: service_healthy
      compliance:
        condition: service_healthy
      supplier-portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shared

  anomaly-detector:
    build:
      context: ..
      dockerfile: ml-services/anomaly-detection/Dockerfile
    command: ["python", "-m", "src.stream_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - ../ml-services/anomaly-detection/models:/app/ml-services/anomaly-detection/models:ro
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - shared
  eta-consumer:
    build:
      context: ..
      dockerfile: ml-services/eta-prediction/Dockerfile
    command: ["python", "-m", "src.stream_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ETA_SEED_DIR: /app/data-platform/seed/out
    volumes:
      - ../data-platform/seed/out:/app/data-platform/seed/out:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - shared

  anomaly-simulator:
    build:
      context: ..
      dockerfile: ml-services/anomaly-detection/Dockerfile
    command:
      - python
      - -m
      - src.stream_simulator
      - --publish
      - --n-per-sensor
      - "1500"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      anomaly-detector:
        condition: service_started
    restart: on-failure
    networks:
      - shared

networks:
  shared:

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  clickhouse_data:
  mongo_data:
  minio_data:
  influxdb_data:
