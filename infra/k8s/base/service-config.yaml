apiVersion: v1
kind: ConfigMap
metadata:
  name: eaicsp-service-config
  namespace: eaicsp
data:
  ENVIRONMENT: development
  COMPLIANCE_USE_FIXTURES: "false"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_URL: redis://redis:6379/0
  INFLUXDB_URL: http://influxdb:8086
  INFLUXDB_ORG: eaicsp
  INFLUXDB_BUCKET: iot_sensors
