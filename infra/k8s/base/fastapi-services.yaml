apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-portal
  namespace: eaicsp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supplier-portal
  template:
    metadata:
      labels:
        app: supplier-portal
    spec:
      containers:
        - name: supplier-portal
          image: eaicsp/supplier-portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: SUPPLIER_PORTAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: SUPPLIER_PORTAL_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql+psycopg://supplier_portal_user:$(SUPPLIER_PORTAL_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: SUPPLIER_DB_SCHEMA
              value: supplier_portal
            - name: PLATFORM_AUTH_URL
              value: http://platform:8005
            - name: COMPLIANCE_SERVICE_URL
              value: http://compliance:8003
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              value: supplier-docs
            - name: MINIO_SECURE
              value: "false"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_ENABLED
              value: "true"
            - name: COMPLIANCE_DB_PATH
              value: /app/data/compliance_state.db
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: supplier-portal
  namespace: eaicsp
spec:
  selector:
    app: supplier-portal
  ports:
    - name: http
      port: 8004
      targetPort: http
---
