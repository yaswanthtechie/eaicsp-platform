apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: eaicsp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      containers:
        - name: platform
          image: eaicsp/platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: SECRET_KEY
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: PLATFORM_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql+psycopg2://platform_user:$(PLATFORM_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: BASE_URL
              value: http://platform:8005
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: eaicsp
spec:
  selector:
    app: platform
  ports:
    - name: http
      port: 8005
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: eaicsp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: eaicsp/inventory:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eaicsp-secrets
