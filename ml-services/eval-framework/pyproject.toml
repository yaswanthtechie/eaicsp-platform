[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-framework"
version = "0.1.0"
description = "Shared model evaluation toolkit for the AI/ML pod: metrics, baselines, leakage guardrails, backtesting, MLflow tracking and CI gating."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
stats = ["scipy>=1.11"]
report = ["matplotlib>=3.8"]
mlflow = ["mlflow>=2.10"]
service = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["eval-framework[stats,report,mlflow,service]"]

[project.scripts]
eval-gate = "eval_framework.gate:main"

[tool.setuptools.packages.find]
where = ["src"]