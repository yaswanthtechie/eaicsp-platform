apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iris-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iris-service

  minReplicas: 2
  maxReplicas: 5

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60