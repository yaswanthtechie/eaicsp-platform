
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-service
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: iris-service

  template:
    metadata:
      labels:
        app: iris-service

    spec:
      containers:
        - name: iris-service
          image: iris-ml-service:round14-v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: iris-service-config

          env:
            - name: MODEL_BUILD_VERSION
              value: "v1"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /livez
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36

          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

