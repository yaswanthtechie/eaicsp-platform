service: "src.service:IrisService"

include:
  - "src"
  - "models"
  # In-service retraining reads the DVC-built training data.
  - "data/reference/processed.csv"

envs:
  - name: BENTO_BUNDLED_MODEL
    value: "true"

python:
  packages:
    - "bentoml==1.4.39"
    - "mlflow==3.4.0"
    - "scikit-learn==1.7.1"
    - "numpy==2.3.2"
    - "pandas"
    - "pydantic==2.11.7"
    - "starlette"