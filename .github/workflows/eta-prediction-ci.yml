name: ETA Prediction CI

# Adapted from Platform Service CI. See docs/ci-template.md.

on:
  push:
    branches:
      - develop
    paths:
      - "ml-services/eta-prediction/**"
      - "ml-services/feature-lib/**"
      - "data-platform/seed/**"
      - ".github/workflows/eta-prediction-ci.yml"
  pull_request:
    paths:
      - "ml-services/eta-prediction/**"
      - "ml-services/feature-lib/**"
      - "data-platform/seed/**"
      - ".github/workflows/eta-prediction-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: ml-services/eta-prediction
  IMAGE_NAME: eta-prediction
  # Matches ml-services/eta-prediction/Dockerfile (FROM python:3.14-slim). Do not change to 3.12.
  PYTHON_VERSION: "3.14"

jobs:
  quality-security-unit:
    name: Lint, type check, security and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt

      - name: Install dependencies and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.17.4 mypy==1.14.0 bandit==1.8.2 pip-audit==2.7.3 pytest-cov==6.0.0

      # Report-only until the owner issue linked in the PR is closed.
      - name: Ruff lint (report-only)
        continue-on-error: true
        run: python -m ruff check --output-format=github .

      - name: Ruff format check (report-only)
        continue-on-error: true
        run: python -m ruff format --check .

      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy src --ignore-missing-imports

      - name: Python syntax check
        run: python -m compileall -q src

      - name: Bandit (code security)
        run: python -m bandit -r src -ll

      - name: pip-audit (report-only)
        continue-on-error: true
        run: python -m pip_audit --desc --skip-editable

      - name: Unit tests with coverage
        id: unit-tests
        run: |
          python -m pytest -o addopts= \
            --tb=short -ra \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=88

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Summary - ${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .coverage ]; then
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ env.IMAGE_NAME }}-coverage
          path: ${{ env.SERVICE_DIR }}/coverage.xml
          if-no-files-found: warn

  docker-trivy:
    name: Build Docker image and scan vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The Dockerfile copies shared folders, so the build context is the repo root.
      - name: Build image (with layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      # The image runs a Kafka consumer with no HTTP port, so check that the
      # entrypoint module and its dependencies import inside the image.
      - name: Smoke-test image imports
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            python -c "import src.stream_consumer; print('image imports OK')"

      - name: Scan image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL