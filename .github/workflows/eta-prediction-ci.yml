name: ETA Prediction CI

on:
  push:
    branches:
      - develop
    paths:
      - "ml-services/eta-prediction/**"
      - "ml-services/feature-lib/**"
      - ".github/workflows/eta-prediction-ci.yml"
  pull_request:
    paths:
      - "ml-services/eta-prediction/**"
      - "ml-services/feature-lib/**"
      - ".github/workflows/eta-prediction-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-services/eta-prediction
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml-services/eta-prediction/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest suite
        run: |
          python -m pytest

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: |
          docker build -f ml-services/eta-prediction/Dockerfile -t eta-prediction:${{ github.sha }} .
