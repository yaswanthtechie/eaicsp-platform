name: Compliance Service CI

# ------------------------------------------------------------------
# Compliance Service CI workflow
# Adapted from Platform Service CI reference template.
# See docs/ci-template.md for architecture conventions.
# ------------------------------------------------------------------

on:
  push:
    branches:
      - develop
    paths:
      - "services/compliance/**"
      - ".github/workflows/compliance-ci.yml"
  pull_request:
    paths:
      - "services/compliance/**"
      - ".github/workflows/compliance-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: services/compliance
  IMAGE_NAME: compliance-service
  # Python 3.12 aligns with services/compliance/Dockerfile (FROM python:3.12-slim) and runtime environment.
  PYTHON_VERSION: "3.12"
  # Required by app.core.config (KeyError if unset). Note: services/compliance/tests/conftest.py
  # overrides this with sqlite:///./test_compliance.db during pytest execution.
  DATABASE_URL: sqlite:////tmp/compliance-unit-ci.db
  # Guarantees fixture-based sanctions data is loaded, avoiding external downloads during CI.
  USE_FIXTURES: "true"

jobs:
  quality-security-unit:
    name: Lint, type check, security and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements*.txt

      - name: Install dependencies and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.17.4 mypy==1.14.0 bandit==1.8.2 pip-audit==2.7.3 pytest-cov==6.0.0

      - name: Ruff lint
        run: python -m ruff check --output-format=github .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy app

      - name: Python syntax check
        run: python -m compileall app

      - name: Bandit (code security)
        run: python -m bandit -r app -ll

      - name: pip-audit (dependency security)
        run: python -m pip_audit -r requirements.txt --desc

      - name: Unit tests with coverage
        id: unit-tests
        run: |
          python -m pytest -o addopts= -m "not integration" \
            --tb=short -ra \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage Summary - ${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .coverage ]; then
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No .coverage file found. Tests may have failed or coverage was not generated."
            echo ":warning: **No .coverage data file found.** Tests may have failed before coverage was written." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.unit-tests.outcome }}" = "success" ] && [ ! -f coverage.xml ]; then
            echo "::error::Unit tests succeeded but coverage.xml was not generated."
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ env.IMAGE_NAME }}-coverage
          path: ${{ env.SERVICE_DIR }}/coverage.xml
          if-no-files-found: warn

  docker-trivy:
    name: Build Docker image and scan vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (with layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      # Note: Container smoke-test is omitted because the container CMD executes
      # 'alembic upgrade head' against a PostgreSQL database with schema 'compliance',
      # requiring dedicated live PostgreSQL infrastructure not present in standalone runs.

      - name: Scan image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
