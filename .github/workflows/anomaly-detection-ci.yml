name: Anomaly Detection CI

on:
  push:
    branches:
      - develop
    paths:
      - "ml-services/anomaly-detection/**"
      - "ml-services/eval-framework/**"
      - ".github/workflows/anomaly-detection-ci.yml"
  pull_request:
    paths:
      - "ml-services/anomaly-detection/**"
      - "ml-services/eval-framework/**"
      - ".github/workflows/anomaly-detection-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-services/anomaly-detection
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-services/anomaly-detection/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest suite
        run: |
          python -m pytest -m "not integration"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: |
          docker build -f ml-services/anomaly-detection/Dockerfile -t anomaly-detection:${{ github.sha }} .
