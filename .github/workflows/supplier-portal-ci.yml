name: Supplier Portal Service CI

# ------------------------------------------------------------------
# TEMPLATE: to adopt this for another service, copy this file to
# .github/workflows/<service>-ci.yml and change THREE things:
#   1. on.pull_request.paths   (GitHub does not allow env vars here)
#   2. env.SERVICE_DIR
#   3. env.IMAGE_NAME
# Then delete or adapt the jobs marked PLATFORM-SPECIFIC.
# Full guide: docs/ci-template.md
# ------------------------------------------------------------------

on:
  pull_request:
    paths:
      - "services/supplier-portal/**"
      - ".github/workflows/supplier-portal-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SERVICE_DIR: services/supplier-portal
  IMAGE_NAME: supplier-portal-service
  PYTHON_VERSION: "3.12"
  # CI-only throwaway key; not used anywhere outside this workflow.
  SECRET_KEY: ci-only-test-secret-key-not-for-production-123456
  MFA_ENABLED: "false"
  MOCK_SSO_ENABLED: "false"

jobs:
  # ---------------------------------------------------------------
  # GENERIC: every Python service keeps this job as is.
  # ---------------------------------------------------------------
  quality-security-unit:
    name: Lint, type check, security and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    env:
      # quality-security-unit job env
      TEST_DATABASE_URL: sqlite:////tmp/unit-ci.db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements*.txt

      - name: Install dependencies and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check --output-format=github .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy --config-file pyproject.toml app

      - name: Bandit (code security)
        run: python -m bandit -r app -ll

      - name: pip-audit (dependency security)
        run: python -m pip_audit -r requirements.txt --desc

      - name: Unit tests with coverage
        run: |
          python -m pytest -o addopts= -m "not integration" \
            --tb=short -ra \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-coverage
          path: ${{ env.SERVICE_DIR }}/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # GENERIC: every service keeps this job as is.
  # ---------------------------------------------------------------
  docker-trivy:
    name: Build Docker image and scan vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3


      - name: Build image (with layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Smoke-test container starts
        run: |
          docker network create supplier-portal-ci
          docker run -d --name supplier-portal-db \
            --network supplier-portal-ci --network-alias postgres \
            -e POSTGRES_USER=supplier_portal \
            -e POSTGRES_PASSWORD=ci-only-db-password \
            -e POSTGRES_DB=eaicsp postgres:16-alpine

          for i in $(seq 1 30); do
            if docker exec supplier-portal-db pg_isready -U supplier_portal -d eaicsp; then
              break
            fi
            sleep 2
          done

          docker run -d --name smoke --network supplier-portal-ci -p 8004:8004 \
            -e SECRET_KEY=ci-only-test-secret-key-not-for-production-123456 \
            -e DATABASE_URL=postgresql+psycopg://supplier_portal:ci-only-db-password@postgres:5432/eaicsp \
            -e MINIO_ACCESS_KEY=ci-only-access-key \
            -e MINIO_SECRET_KEY=ci-only-secret-key \
            -e KAFKA_ENABLED=false \
            -e GOODS_RECEIVED_KAFKA_ENABLED=false \
            -e PO_KAFKA_ENABLED=false \
            -e PO_OUTBOX_ENABLED=false \
            -e SHIPMENT_OUTBOX_ENABLED=false \
            -e ETA_KAFKA_ENABLED=false \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8004/health > /dev/null; then
              echo "Supplier Portal container is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Supplier Portal container did not start:"
          docker logs smoke
          exit 1

      - name: Scan image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

