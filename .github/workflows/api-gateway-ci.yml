name: API Gateway CI

on:
  push:
    branches:
      - develop
    paths:
      - "services/api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
      - "contracts/**"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
      - "contracts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api-gateway
    env:
      SECRET_KEY: test-secret-key-for-jwt-signing-do-not-use-in-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api-gateway/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest suite
        run: |
          python -m pytest -m "not integration"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: |
          docker build -t api-gateway:${{ github.sha }} -f services/api-gateway/Dockerfile services/api-gateway
