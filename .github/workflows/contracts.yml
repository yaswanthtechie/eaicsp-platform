name: Contract Validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema referencing pytest

      - name: Run Contract Validation Tests
        run: |
          pytest contracts/tests/ -v

      - name: Run Contract Check on Real Contracts
        run: |
          python contracts/contract_check.py contracts/