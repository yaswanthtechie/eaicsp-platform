version: "3.8"

services:
  postgres-profiler:
    image: postgres:16-alpine
    container_name: profiling-postgres-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  airflow-tester:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow-tester
    depends_on:
      postgres-profiler:
        condition: service_healthy
    working_dir: /opt/profiling
    volumes:
      - .:/opt/profiling
    environment:
      - PYTHONPATH=/opt/profiling
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Inside Docker the DB is postgres-profiler:5432, not localhost:5433
      - PROFILING_DB_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-profiler:5432/${POSTGRES_DB}
    # Install required DB drivers on startup, then keep the container alive
    entrypoint: ["/bin/bash", "-c", "pip install --no-cache-dir -r /opt/profiling/requirements-airflow.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.7.3/constraints-3.10.txt && sleep infinity"]
#    command: bash -c "pip install --no-cache-dir -r /opt/airflow/requirements-airflow.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.7.3/constraints-3.10.txt && sleep infinity"