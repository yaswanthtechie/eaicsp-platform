version: 1.0.0
rules:
- name: date_not_null
  field: date
  type: not_null
  severity: ERROR
- name: sku_id_not_null
  field: sku_id
  type: not_null
  severity: ERROR
- name: warehouse_id_not_null
  field: warehouse_id
  type: not_null
  severity: ERROR
- name: quantity_sold_range
  field: quantity_sold
  type: range
  min: 1.0
  max: 153.5
  severity: WARNING
- name: unit_price_range
  field: unit_price
  type: range
  min: 100.0
  max: 1000.0
  severity: WARNING
