[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-validator"
version = "1.2.0"
description = "A configuration-driven data quality firewall with Kafka streaming, PostgreSQL, and Prometheus support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "confluent-kafka>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.17.0"
]

[project.optional-dependencies]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
validate_data = "src.validate_cli:main"
generate_messy_data = "src.make_messy_data:main"
run_pipeline = "src.main:main"
perf_test = "src.perf_test:main"
validate_folder = "src.validate_folder:main"
validate_stream_kafka = "src.streaming_validator:main"
produce_kafka_test_data = "scripts.produce_test_data:main"
metrics = "src.metrics:main"

[tool.setuptools]
packages = ["src", "rules", "scripts"]

[tool.coverage.run]
source = ["src", "rules"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring external infrastructure (e.g., Docker, Kafka, Postgres) (deselect with '-m \"not integration\"')"
]
addopts = "--cov=src --cov=rules --cov-report=term-missing --cov-fail-under=98"