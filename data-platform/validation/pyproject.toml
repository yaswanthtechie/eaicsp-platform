[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-validator"
version = "2.0.0"
description = "A configuration-driven data quality firewall with Kafka streaming, PostgreSQL, and Prometheus support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "confluent-kafka>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.17.0"
]

[project.optional-dependencies]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
validate_data = "data_validator.validate_cli:main"
generate_messy_data = "data_validator.make_messy_data:main"
run_pipeline = "data_validator.main:main"
perf_test = "data_validator.perf_test:main"
validate_folder = "data_validator.validate_folder:main"
validate_stream_kafka = "data_validator.streaming_validator:main"
produce_kafka_test_data = "data_validator.produce_test_data:main"

[tool.setuptools]
# One uniquely named package. "src", "rules" and "scripts" are generic
# names that clash with other projects' folders once installed.
# rules/ is loaded from disk by path (registry.discover_rules), so it does
# not need to be an installed package.
packages = ["data_validator"]

[tool.coverage.run]
source = ["data_validator", "rules"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring external infrastructure (e.g., Docker, Kafka, Postgres) (deselect with '-m \"not integration\"')"
]
addopts = "--cov=data_validator --cov=rules --cov-report=term-missing --cov-fail-under=98"