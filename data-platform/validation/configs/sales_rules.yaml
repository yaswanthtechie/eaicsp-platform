# configs/sales_rules.yaml
rules:
# --- SIMPLE RULES (Built-in) ---
  - name: order_date_not_null
    field: order_date
    type: not_null
    severity: ERROR

  - name: quantity_positive
    field: quantity_sold
    type: range
    min: 0
    max: 100000
    severity: WARNING

  - name: sku_format
    field: sku_id
    type: regex
    pattern: "^SKU-[0-9]{4}$"
    severity: ERROR

  - name: missing_quantity
    field: quantity_sold
    type: not_null
    severity: ERROR

  - name: duplicate_rows
    field: transaction_id
    type: unique
    severity: ERROR

  - name: transaction_id_not_null
    field: transaction_id
    type: not_null
    severity: ERROR

  - name: sku_id_not_null
    field: sku_id
    type: not_null
    severity: ERROR

  # --- COMPLEX RULES (Custom Escape Hatch) ---
  - name: unparseable_dates
    field: order_date
    type: custom
    function: src.custom_rules.check_unparseable_dates
    severity: ERROR

  - name: outlier_quantity
    field: quantity_sold
    type: custom
    function: src.custom_rules.check_outliers
    severity: WARNING

  - name: standardize_product_names
    field: product_name
    type: transform
    function: src.custom_rules.standardize_products
    severity: INFO