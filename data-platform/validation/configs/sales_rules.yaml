# configs/sales_rules.yaml
version: "1.1.0"
profiles:
  default:
    global_max_fail_pct: 0.20  # Rejects batch if >20% of all rows fail ANY rules
    rules:
      - name: date_not_null
        field: date
        type: not_null
        severity: ERROR

      - name: sku_format
        field: sku_id
        type: regex
        pattern: "^SKU-[0-9]{4}$"
        severity: ERROR
        max_fail_pct: 0.05     # Reject batch if >5% of rows fail THIS specific rule

      - name: warehouse_id_not_null
        field: warehouse_id
        type: not_null
        severity: ERROR

      # --- NEW: DECLARATIVE CROSS-FIELD CONDITIONAL ---
      # Example: If warehouse is WH-01, the unit price must be at least 15.00
      - name: wh_01_minimum_price
        type: conditional
        condition_field: warehouse_id
        condition_value: "WH-01"
        field: unit_price
        target_type: range
        min: 15.0
        severity: WARNING
        max_fail_pct: 0.10     # Tolerates up to 10% failures for this warning before throwing a flag

      - name: quantity_positive
        field: quantity_sold
        type: range
        min: 0
        max: 100000
        severity: WARNING

      - name: unit_price_valid
        field: unit_price
        type: range
        min: 0.01
        severity: ERROR

      - name: composite_pk_unique
        type: custom
        function: src.custom_rules.check_composite_unique
        subset: ['date', 'sku_id', 'warehouse_id']
        severity: ERROR

      - name: unparseable_dates
        field: date
        type: custom
        function: src.custom_rules.check_unparseable_dates
        severity: ERROR

      - name: flag_negative_quantities
        field: quantity_sold
        type: transform
        function: src.custom_rules.flag_negatives
        severity: INFO

      - name: standardize_dates_transform
        field: date
        type: transform
        function: src.custom_rules.standardize_dates
        severity: INFO

      - name: date_in_range
        field: date
        type: range
        min: '2024-01-01'
        max: '2024-04-02'
        severity: WARNING
        depends_on: [ "unparseable_dates" ]

  strict:
    inherits: default
    global_max_fail_pct: 0.10  # Overrides the default 20% backstop to a stricter 10%
    rules:
      # Overrides the default warning with a strict error and tighter bounds
      - name: quantity_positive
        field: quantity_sold
        type: range
        min: 1
        max: 13
        severity: ERROR