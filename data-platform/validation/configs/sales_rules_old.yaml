# configs/sales_rules.yaml
rules:
# --- SIMPLE RULES (Built-in) ---
  - name: order_date_not_null
    field: date
    type: not_null
    severity: ERROR

  - name: quantity_positive
    field: quantity_sold
    type: range
    min: 0
    max: 100000
    severity: WARNING

  - name: missing_quantity
    field: quantity_sold
    type: not_null
    severity: ERROR

# --- COMPLEX RULES (Custom Escape Hatch) ---
  - name: unparseable_dates
    field: date
    type: custom
    function: src.custom_rules.check_unparseable_dates
    severity: ERROR

  - name: outlier_quantity
    field: quantity_sold
    type: custom
    function: src.custom_rules.check_outliers
    severity: WARNING

# --- TRANSFORMATION RULES ---
  - name: standardize_product_names
    field: product_name
    type: transform
    function: src.custom_rules.standardize_products
    severity: INFO

  - name: flag_negative_quantities
    field: quantity_sold
    type: transform
    function: src.custom_rules.flag_negatives
    severity: INFO

  - name: standardize_order_dates
    field: date
    type: transform
    function: src.custom_rules.standardize_dates
    severity: INFO

# --- DUPLICATE ROW HANDLING ---
  # Validates and logs the duplicates
  - name: check_duplicate_rows
    type: custom
    function: src.custom_rules.check_duplicate_rows
    severity: ERROR

  # Actually removes the duplicates during the cleaning phase
  - name: drop_duplicate_rows
    type: transform
    function: src.custom_rules.drop_duplicate_rows
    severity: INFO