staging_status: proposed_client_ingestion_staging_contract
staging_note: These staging columns describe the proposed client-ingestion contract,
  not existing dbt models. Existing dbt staging models use canonical IDs.
canonical_id_formats:
  sku_id:
    format: SKU-######
    example: SKU-000123
  warehouse_id:
    format: WH-<IATA>-##
    example: WH-BOM-01
    rule: Map by warehouse city to its IATA code; never use the client code prefix.
  supplier_id:
    format: SUP-#####
    example: SUP-00045
  po_id:
    format: PO-YYYY-######
    example: PO-2026-000123
    rule: YYYY is the year of order_date.
  shipment_id:
    format: SHP-YYYY-######
    example: SHP-2026-000077
    rule: YYYY is the year of dispatch_date.
warehouse_city_to_iata:
  Hyderabad: HYD
  Bengaluru: BLR
  Mumbai: BOM
  New Delhi: DEL
  Chennai: MAA
  Kolkata: CCU
  Pune: PNQ
lookup_or_generate:
- Look up the client code in the ID mapping table; reuse the canonical ID if found.
- Otherwise look up an existing seed ID for the same real entity.
- Otherwise generate the next free number in the canonical format and store the mapping.
- The same client code must always map to the same canonical ID.
