        type: string
        required: true
        format: text
      carrier_type:
        type: string
        required: true
        format: text
        inferred: true
      base_late_rate:
        type: decimal
        required: true
        format: 0 to 1
        inferred: true
      is_active:
        type: boolean
        required: true
        format: true/false
