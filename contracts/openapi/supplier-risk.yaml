openapi: 3.1.0
info:
  title: Supplier Risk Score API
  version: 1.0.0
  description: Contract for retrieving a supplier risk score and its supporting evidence.

paths:
  /api/v1/suppliers/{supplier_id}/risk-score:
    get:
      operationId: getSupplierRiskScore
      summary: Get supplier risk score
      description: >-
        Returns the latest computed risk score, risk tier, top contributing
        factors, supporting evidence articles, and computation timestamp.

        1. **No evidence:** For a known supplier with no recent evidence, return
        HTTP 200 with `score: null`, `tier: null`, and empty `top_factors` and
        `top_evidence_articles` arrays. Null means “no evidence,” not zero risk.
        Do not return `score: 0` or `tier: Low` for this case.

        2. **Supplier Portal behavior:** During onboarding, callers should use a
        2-second timeout. On timeout, HTTP 503, or any 5xx, show “risk
        unavailable” and do not block onboarding.

        3. **Tier mapping:** This endpoint uses `Low`, `Medium`, `High`,
        `Critical`. The `supplierrisk.score.changed` event uses lowercase `low`,
        `medium`, `high`, with `Critical` mapping to `high`.
      security:
        - serviceKey: []
          callerService: []
        - bearerAuth: []
      parameters:
        - name: supplier_id
          in: path
          required: true
          description: Canonical supplier identifier.
          schema:
            type: string
            pattern: '^SUP-[0-9]{5}$'
            example: SUP-00045
      responses:
        '200':
          description: Supplier risk score retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRiskScoreResponse'
              examples:
                scored:
                  value:
                    supplier_id: SUP-00045
                    score: 78.5
                    tier: High
                    top_factors:
                      - factor: insolvency
                        category: Financial
                        weight: 45
                        description: Insolvency-related adverse media.
                      - factor: investigation
                        category: Reputational
                        weight: 25
                        description: Investigation-related adverse media.
                    top_evidence_articles:
                      - headline: >-
                          Regulators launch an investigation into supplier
                          accounting practices.
                        date: '2026-10-14'
                        sentiment: negative
                        score: 65.0
                        signals:
                          - keyword: investigation
                            weight: 25
                    computed_at: '2026-10-15T10:30:00Z'
                no_evidence:
                  summary: Known supplier with no recent evidence
                  value:
                    supplier_id: SUP-00012
                    score: null
                    tier: null
                    top_factors: []
                    top_evidence_articles: []
                    computed_at: '2026-10-15T10:30:00Z'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: UNAUTHORIZED
                message: Missing or invalid authentication credentials.
        '404':
          description: Supplier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: SUPPLIER_NOT_FOUND
                message: Supplier SUP-00999 was not found.
        '422':
          description: Invalid supplier identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_SUPPLIER_ID
                message: The supplier identifier is invalid.
        '503':
          description: Supplier risk score is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: RISK_UNAVAILABLE
                message: The supplier risk score is temporarily unavailable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform-issued user JWT (dashboard / human callers).
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: >-
        Shared service key for service-to-service calls. Same pattern as
        compliance /internal-check. Must be sent together with X-Caller-Service.
    callerService:
      type: apiKey
      in: header
      name: X-Caller-Service
      description: Name of the calling service, e.g. supplier-portal.

  schemas:
    SupplierRiskScoreResponse:
      type: object
      required:
        - supplier_id
        - score
        - tier
        - top_factors
        - top_evidence_articles
        - computed_at
      properties:
        supplier_id:
          type: string
          pattern: '^SUP-[0-9]{5}$'
          description: Canonical supplier identifier, echoed from the path.
          example: SUP-00045
        score:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: Aggregate supplier risk score from 0 to 100.
          example: 78.5
        tier:
          type:
            - string
            - 'null'
          enum:
            - Low
            - Medium
            - High
            - Critical
            - null
          description: Four-tier risk classification; null when no applicable evidence exists.
          example: High
        top_factors:
          type: array
          description: Highest-contributing risk factors.
          items:
            $ref: '#/components/schemas/RiskFactor'
        top_evidence_articles:
          type: array
          description: News articles supporting the computed risk score.
          items:
            $ref: '#/components/schemas/EvidenceArticle'
        computed_at:
          type: string
          format: date-time
          description: UTC timestamp when the returned score was computed.
          example: '2026-10-15T10:30:00Z'

    RiskFactor:
      type: object
      required:
        - factor
        - category
        - weight
        - description
      properties:
        factor:
          type: string
          description: Risk signal or factor name.
          example: insolvency
        category:
          type: string
          enum:
            - Financial
            - Operational
            - Reputational
            - Security
          description: >-
            Risk category, fixed per signal keyword.
            Financial: bankruptcy, insolvency, default, restructuring, layoff, downgrade.
            Operational: strike, recall, disruption, shortage, delays, shutdown, outage.
            Reputational: fraud, investigation, lawsuit.
            Security: sanction, cyberattack.
        weight:
          type: number
          description: Configured signal weight.
          example: 45
        description:
          type: string
          description: Human-readable explanation of the factor.

    EvidenceArticle:
      type: object
      required:
        - headline
        - date
        - sentiment
        - score
        - signals
      properties:
        headline:
          type: string
          description: Supporting news headline.
        date:
          type:
            - string
            - 'null'
          format: date
          description: Article publication date; null when the source has no date.
        sentiment:
          type: string
          enum:
            - positive
            - neutral
            - negative
          description: Article sentiment classification.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Risk score of this single article (0 to 100): sentiment penalty plus
            the weights of its detected signals, capped at 100.
        signals:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceSignal'

    EvidenceSignal:
      type: object
      required:
        - keyword
        - weight
      properties:
        keyword:
          type: string
          description: Detected risk keyword.
        weight:
          type: number
          description: Configured weight of the detected keyword.

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Machine-readable uppercase error token, e.g. SUPPLIER_NOT_FOUND.
        message:
          type: string
          description: Human-readable error description.
