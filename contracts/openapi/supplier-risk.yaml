openapi: 3.1.0
info:
  title: Supplier Risk Score API
  version: 1.0.0
  description: Contract for retrieving a supplier risk score and its supporting evidence.

paths:
  /api/v1/suppliers/{supplier_id}/risk-score:
    get:
      operationId: getSupplierRiskScore
      summary: Get supplier risk score
      description: >-
        Returns the latest computed risk score, risk tier, top contributing
        factors, supporting evidence articles, and computation timestamp.

        1. **No evidence:** For a known supplier with no recent evidence, return
        HTTP 200 with `score: null`, `tier: null`, and empty `top_factors` and
        `top_evidence_articles` arrays. Null means “no evidence,” not zero risk.
        Do not return `score: 0` or `tier: Low` for this case.

        2. **Supplier Portal behavior:** During onboarding, callers should use a
        2-second timeout. On timeout, HTTP 503, or any 5xx, show “risk
        unavailable” and do not block onboarding.

        3. **Tier mapping:** This endpoint uses `Low`, `Medium`, `High`,
        `Critical`. The `supplierrisk.score.changed` event uses lowercase `low`,
        `medium`, `high`, with `Critical` mapping to `high`.
      security:
        - apiKey: []
        - serviceKey: []
          callerService: []
        - bearerAuth: []
      parameters:
        - name: supplier_id
          in: path
          required: true
          description: Canonical supplier identifier.
          schema:
            type: string
            pattern: '^SUP-[0-9]{5}$'
            example: SUP-00045
        - name: as_of_date
          in: query
          required: false
          description: Optional reference date for scoring evaluation (ISO YYYY-MM-DD). Defaults to current UTC date.
          schema:
            type: string
            format: date
            example: '2026-10-15'
      responses:
        '200':
          description: Supplier risk score retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRiskScoreResponse'
              examples:
                scored:
                  value:
                    supplier_id: SUP-00045
                    score: 78.5
                    tier: High
                    top_factors:
                      - factor: insolvency
                        category: Financial
                        weight: 45
                        description: Insolvency-related adverse media.
                      - factor: investigation
                        category: Reputational
                        weight: 25
                        description: Investigation-related adverse media.
                    top_evidence_articles:
                      - headline: >-
                          Regulators launch an investigation into supplier
                          accounting practices.
                        date: '2026-10-14'
                        sentiment: negative
                        score: 65.0
                        signals:
                          - keyword: investigation
                            weight: 25
                    computed_at: '2026-10-15T10:30:00Z'
                no_evidence:
                  summary: Known supplier with no recent evidence
                  value:
                    supplier_id: SUP-00012
                    score: null
                    tier: null
                    top_factors: []
                    top_evidence_articles: []
                    computed_at: '2026-10-15T10:30:00Z'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: UNAUTHORIZED
                message: Missing or invalid authentication credentials.
        '403':
          description: Valid service API key, but this service is not allowed to call this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: FORBIDDEN
                message: This service is not allowed to call this endpoint.
        '404':
          description: Supplier was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: SUPPLIER_NOT_FOUND
                message: Supplier SUP-00999 was not found.
        '422':
          description: Invalid supplier identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_SUPPLIER_ID
                message: The supplier identifier is invalid.
        '503':
          description: Supplier risk score is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: RISK_UNAVAILABLE
                message: The supplier risk score is temporarily unavailable.

  /api/v1/supplier-risk/client-suppliers/{supplier_code}/risk-score:
    get:
      operationId: getClientSupplierRiskScore
      summary: Get supplier risk score by client supplier code
      description: >-
        Resolves a client supplier code to its canonical supplier ID using explicit mapping
        and returns the computed risk score integrating client master data, operational incidents,
        and adverse news media.
      security:
        - apiKey: []
        - serviceKey: []
          callerService: []
        - bearerAuth: []
      parameters:
        - name: supplier_code
          in: path
          required: true
          description: Client supplier code (e.g. SUP-2231).
          schema:
            type: string
            example: SUP-2231
        - name: as_of_date
          in: query
          required: false
          description: Optional reference date for scoring evaluation (ISO YYYY-MM-DD). Defaults to current UTC date.
          schema:
            type: string
            format: date
            example: '2026-10-15'
      responses:
        '200':
          description: Supplier risk score retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRiskScoreResponse'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden caller service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Supplier code was not found or has no canonical mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Risk score is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform-issued user JWT (dashboard / human callers).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Platform-issued service API key (R15-RH1, #213), checked with Platform's /api/v1/auth/service-verify. Allowed callers: supplier-portal and gateway-bff. A gateway-bff key must also carry the user's Bearer JWT. Any other service gets 403.
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: >-
        Shared service key for service-to-service calls. Same pattern as
        compliance /internal-check. Must be sent together with X-Caller-Service.
    callerService:
      type: apiKey
      in: header
      name: X-Caller-Service
      description: Name of the calling service, e.g. supplier-portal.

  schemas:
    SupplierRiskScoreResponse:
      type: object
      required:
        - supplier_id
        - score
        - tier
        - top_factors
        - top_evidence_articles
        - computed_at
      properties:
        supplier_id:
          type: string
          pattern: '^SUP-[0-9]{5}$'
          description: Canonical supplier identifier, echoed from the path.
          example: SUP-00045
        score:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: Aggregate supplier risk score from 0 to 100.
          example: 78.5
        tier:
          type:
            - string
            - 'null'
          enum:
            - Low
            - Medium
            - High
            - Critical
            - null
          description: Four-tier risk classification; null when no applicable evidence exists.
          example: High
        top_factors:
          type: array
          description: Highest-contributing risk factors.
          items:
            $ref: '#/components/schemas/RiskFactor'
        top_evidence_articles:
          type: array
          description: News articles supporting the computed risk score.
          items:
            $ref: '#/components/schemas/EvidenceArticle'
        computed_at:
          type: string
          format: date-time
          description: UTC timestamp when the returned score was computed.
          example: '2026-10-15T10:30:00Z'
        top_reasons:
          type: array
          description: Top human-readable reasons explaining the risk score grounded in actual input data.
          items:
            type: string
          example:
            - '4 delay incidents in 12 months'
            - 'Recent incident occurred 15 days ago'
            - 'On-time delivery rate is 94.5%'
        client_risk_features:
          description: Client-based risk features; null when the supplier has no client data.
          oneOf:
            - $ref: '#/components/schemas/ClientRiskFeatures'
            - type: 'null'

    RiskFactor:
      type: object
      required:
        - factor
        - category
        - weight
        - description
      properties:
        factor:
          type: string
          description: Risk signal or factor name.
          example: insolvency
        category:
          type: string
          enum:
            - Financial
            - Operational
            - Reputational
            - Security
          description: >-
            Risk category, fixed per signal keyword.
            Financial: bankruptcy, insolvency, default, restructuring, layoff, downgrade.
            Operational: strike, recall, disruption, shortage, delays, shutdown, outage.
            Reputational: fraud, investigation, lawsuit.
            Security: sanction, cyberattack.
        weight:
          type: number
          description: Configured signal weight.
          example: 45
        description:
          type: string
          description: Human-readable explanation of the factor.

    EvidenceArticle:
      type: object
      required:
        - headline
        - date
        - sentiment
        - score
        - signals
      properties:
        headline:
          type: string
          description: Supporting news headline.
        date:
          type:
            - string
            - 'null'
          format: date
          description: Article publication date; null when the source has no date.
        sentiment:
          type: string
          enum:
            - positive
            - neutral
            - negative
          description: Article sentiment classification.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Risk score of this single article (0 to 100): sentiment penalty plus
            the weights of its detected signals, capped at 100.
        signals:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceSignal'

    EvidenceSignal:
      type: object
      required:
        - keyword
        - weight
      properties:
        keyword:
          type: string
          description: Detected risk keyword.
        weight:
          type: number
          description: Configured weight of the detected keyword.

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Machine-readable uppercase error token, e.g. SUPPLIER_NOT_FOUND.
        message:
          type: string
          description: Human-readable error description.

    ClientRiskFeatures:
      type: object
      description: Client-based operational risk features and incident metrics (Issue #350).
      properties:
        quality_incidents_12m:
          type: integer
          description: Quality incident count in the previous 12 months.
          example: 2
        delay_incidents_12m:
          type: integer
          description: Delay incident count in the previous 12 months.
          example: 4
        dispute_incidents_12m:
          type: integer
          description: Dispute incident count in the previous 12 months.
          example: 1
        other_incidents_12m:
          type: integer
          description: Other incident count in the previous 12 months.
          example: 0
        days_since_last_incident:
          type:
            - integer
            - 'null'
          description: Days elapsed since the last eligible incident; null when no incidents exist.
          example: 15
        on_time_delivery_pct:
          type:
            - number
            - 'null'
          description: On-time delivery percentage from supplier master; null when missing.
          example: 94.5
        on_time_delivery_missing:
          type: boolean
          description: Flag indicating on-time delivery data was not provided in supplier master.
          example: false
        country:
          type:
            - string
            - 'null'
          description: Supplier operating country from master data.
          example: India
        city:
          type:
            - string
            - 'null'
          description: Supplier operating city from master data.
          example: Bengaluru
        category:
          type:
            - string
            - 'null'
          description: Supplier commodity or product category from master data.
          example: Electronics
