services:
  minio:
    image: supplier-portal-minio:community
    container_name: supplier-portal-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - supplier_portal_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  supplier_portal_minio_data: