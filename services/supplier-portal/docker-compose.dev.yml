services:
  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_REF: RELEASE.2025-10-15T17-29-55Z

    image: supplier-portal-minio:dev
    container_name: supplier-portal-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}

    volumes:
      - supplier_portal_minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

volumes:
  supplier_portal_minio_data: