[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "BLE001",
    "C408",
    "PLW1510",
    "RUF022",
    "RUF100",
    "S110",
]

[tool.ruff.lint.per-file-ignores]
"app/routes/*.py" = ["B008"]
"app/core/dependencies.py" = ["B008"]
"app/core/service_auth.py" = ["B008"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["kafka.*"]
ignore_missing_imports = true
